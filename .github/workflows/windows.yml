name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python lint and format (ruff)
        run: |
          python -m pip install ruff==0.16.8
          ruff check source
          ruff format --check source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Interface format (prettier)
        run: npx --yes prettier@3.8.1 --check "source/ui/**/*.{html,css,js}"

  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Hosted runners have no sound device, so Windows MediaPlayer fails with
      # 0xC00D11BA. Install a virtual audio endpoint for the native audio test.
      - uses: LABSN/sound-ci-helpers@v1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests (no hardware writes, no desktop shortcuts)
        run: python test_studio.py

  build:
    needs: [lint, test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build EXE
        shell: pwsh
        run: ./source/build.ps1
      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem source/dist/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii source/dist/SHA256.txt
          Get-Content source/dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SMC-PAD-Studio
          path: |
            source/dist/*.exe
            source/dist/SHA256.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            source/dist/*.exe
            source/dist/SHA256.txt
            VERIFICATION-v0.6.0.json
            THIRD-PARTY-NOTICES.txt
